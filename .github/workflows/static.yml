<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EstateIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0F;--bg2:#131316;--bg3:#1A1A1E;--bg4:#222228;
  --border:#2E2E38;--border2:#3A3A48;
  --text:#F0EEE8;--text2:#A0A0B0;--text3:#606070;
  --gold:#C9A84C;--gold2:#E8C96A;--gold3:#F5DFA0;
  --accent:#4A9EFF;--accent2:#7BB8FF;
  --green:#4CAF7A;--red:#E05555;--orange:#E07A35;
  --r:8px;--r2:14px;--r3:20px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3,.serif{font-family:'Playfair Display',serif}
button{cursor:pointer;border:none;font-family:'DM Sans',sans-serif}
input,select,textarea{font-family:'DM Sans',sans-serif}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:100;background:rgba(13,13,15,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;height:60px;gap:2rem}
.nav-logo{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold2);letter-spacing:.02em;white-space:nowrap}
.nav-logo span{color:var(--text2);font-size:.8rem;font-family:'DM Sans',sans-serif;margin-left:6px;font-weight:300}
.nav-tabs{display:flex;gap:4px;margin-left:auto}
.nav-tab{padding:6px 14px;border-radius:var(--r);background:none;color:var(--text2);font-size:.85rem;font-weight:500;transition:all .2s}
.nav-tab:hover{background:var(--bg3);color:var(--text)}
.nav-tab.active{background:var(--gold);color:#0D0D0F;font-weight:600}
.nav-badge{background:var(--red);color:#fff;font-size:.65rem;padding:1px 5px;border-radius:20px;margin-left:4px;vertical-align:middle}

/* ── PAGES ── */
.page{display:none;min-height:calc(100vh - 60px)}
.page.active{display:block}

/* ── HERO ── */
.hero{padding:4rem 2rem 3rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 0%, rgba(201,168,76,.08), transparent);pointer-events:none}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:var(--gold2);font-size:.78rem;font-weight:500;padding:5px 14px;border-radius:20px;margin-bottom:1.5rem}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.15;color:var(--text);margin-bottom:1rem}
.hero h1 em{color:var(--gold2);font-style:normal}
.hero p{color:var(--text2);font-size:1rem;max-width:520px;margin:0 auto 2rem;line-height:1.7}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-primary{background:var(--gold);color:#0D0D0F;padding:11px 24px;border-radius:var(--r);font-weight:600;font-size:.9rem;transition:all .2s}
.btn-primary:hover{background:var(--gold2);transform:translateY(-1px)}
.btn-secondary{background:var(--bg3);color:var(--text);padding:11px 24px;border-radius:var(--r);font-weight:500;font-size:.9rem;border:1px solid var(--border2);transition:all .2s}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold2)}

/* ── SEARCH BAR ── */
.search-bar{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:1rem 1.25rem;display:flex;gap:12px;align-items:center;max-width:700px;margin:0 auto 3rem;flex-wrap:wrap}
.search-field{flex:1;min-width:120px}
.search-field label{display:block;font-size:.72rem;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.search-field input,.search-field select{width:100%;background:none;border:none;color:var(--text);font-size:.9rem;outline:none}
.search-field select option{background:var(--bg3)}
.search-divider{width:1px;height:40px;background:var(--border);flex-shrink:0}
.search-btn{background:var(--gold);color:#0D0D0F;padding:10px 20px;border-radius:var(--r);font-weight:600;font-size:.85rem;white-space:nowrap;transition:all .2s}
.search-btn:hover{background:var(--gold2)}

/* ── STATS ── */
.stats-row{display:flex;justify-content:center;gap:3rem;margin-bottom:3rem;flex-wrap:wrap}
.stat-item{text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--gold2)}
.stat-label{font-size:.78rem;color:var(--text3);margin-top:2px}

/* ── SECTION ── */
.section{padding:2rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.section-header h2{font-size:1.4rem}
.section-link{color:var(--gold2);font-size:.85rem;font-weight:500;background:none;border:none;cursor:pointer}
.section-link:hover{text-decoration:underline}

/* ── FILTERS ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
.filter-chip{padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:500;background:var(--bg3);color:var(--text2);border:1px solid var(--border);transition:all .2s}
.filter-chip:hover{border-color:var(--gold);color:var(--gold2)}
.filter-chip.active{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold2)}

/* ── PROPERTY GRID ── */
.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem}
.prop-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;transition:all .3s;cursor:pointer}
.prop-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.prop-img{height:200px;position:relative;overflow:hidden}
.prop-img-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:4rem}
.prop-badge{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:600}
.badge-sale{background:var(--green);color:#fff}
.badge-rent{background:var(--accent);color:#fff}
.badge-new{background:var(--gold);color:#0D0D0F}
.badge-sold{background:var(--red);color:#fff}
.prop-fav{position:absolute;top:12px;right:12px;background:rgba(13,13,15,.7);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;transition:all .2s}
.prop-fav:hover,.prop-fav.active{color:var(--red);background:rgba(224,85,85,.15)}
.prop-body{padding:1rem}
.prop-price{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold2);margin-bottom:4px}
.prop-title{font-size:.9rem;font-weight:500;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop-loc{font-size:.78rem;color:var(--text2);display:flex;align-items:center;gap:4px;margin-bottom:12px}
.prop-meta{display:flex;gap:12px;font-size:.78rem;color:var(--text3);border-top:1px solid var(--border);padding-top:10px}
.prop-meta-item{display:flex;align-items:center;gap:4px}
.prop-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 1rem 1rem}
.btn-book{background:var(--gold);color:#0D0D0F;padding:8px;border-radius:var(--r);font-size:.82rem;font-weight:600;transition:all .2s}
.btn-book:hover{background:var(--gold2)}
.btn-view{background:var(--bg3);color:var(--text);padding:8px;border-radius:var(--r);font-size:.82rem;font-weight:500;border:1px solid var(--border);transition:all .2s}
.btn-view:hover{border-color:var(--gold2);color:var(--gold2)}

/* ── PROPERTY DETAIL MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:2rem;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);width:100%;max-width:760px;overflow:hidden;margin:auto}
.modal-img{height:280px;display:flex;align-items:center;justify-content:center;font-size:6rem;background:var(--bg3);position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:rgba(13,13,15,.7);border:1px solid var(--border);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:1.1rem;cursor:pointer;transition:all .2s}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-body{padding:1.5rem}
.modal-price{font-family:'Playfair Display',serif;font-size:2rem;color:var(--gold2);margin-bottom:.25rem}
.modal-title{font-size:1.1rem;font-weight:500;margin-bottom:.5rem}
.modal-loc{color:var(--text2);font-size:.88rem;display:flex;align-items:center;gap:6px;margin-bottom:1.5rem}
.modal-specs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.spec-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.75rem;text-align:center}
.spec-val{font-size:1.1rem;font-weight:600;color:var(--text)}
.spec-key{font-size:.72rem;color:var(--text3);margin-top:2px}
.modal-desc{color:var(--text2);font-size:.88rem;line-height:1.7;margin-bottom:1.5rem}
.modal-features{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.5rem}
.feature-tag{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.78rem;color:var(--text2)}
.modal-agent{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:1.5rem}
.agent-avatar{width:44px;height:44px;border-radius:50%;background:rgba(201,168,76,.2);display:flex;align-items:center;justify-content:center;color:var(--gold2);font-weight:600;font-size:.95rem;flex-shrink:0}
.agent-info{flex:1}
.agent-name{font-weight:500;font-size:.9rem}
.agent-role{font-size:.78rem;color:var(--text3)}
.agent-rating{color:var(--gold2);font-size:.78rem}
.modal-cta{display:grid;grid-template-columns:2fr 1fr;gap:10px}

/* ── BOOK MODAL ── */
.book-modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);width:100%;max-width:520px;overflow:hidden;margin:auto}
.book-header{padding:1.5rem;border-bottom:1px solid var(--border)}
.book-header h3{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--text);margin-bottom:.25rem}
.book-header p{font-size:.82rem;color:var(--text2)}
.book-body{padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:.78rem;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.form-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;color:var(--text);font-size:.88rem;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--gold)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.time-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time-slot{padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);font-size:.8rem;color:var(--text2);cursor:pointer;transition:all .2s;text-align:center}
.time-slot:hover{border-color:var(--gold2);color:var(--gold2)}
.time-slot.selected{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold2);font-weight:500}
.time-slot.taken{opacity:.4;cursor:not-allowed;border-style:dashed}
.book-footer{padding:0 1.5rem 1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai-assist{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;gap:10px;align-items:flex-start}
.ai-icon{width:28px;height:28px;border-radius:6px;background:rgba(74,158,255,.15);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:.9rem;flex-shrink:0;margin-top:1px}
.ai-text{font-size:.8rem;color:var(--text2);line-height:1.5}
.ai-text strong{color:var(--text);font-weight:500}

/* ── APPOINTMENT LIST ── */
.appt-list{display:flex;flex-direction:column;gap:10px}
.appt-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1rem 1.25rem;display:flex;align-items:center;gap:1rem;transition:border-color .2s}
.appt-card:hover{border-color:var(--border2)}
.appt-date{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.5rem .75rem;text-align:center;flex-shrink:0;min-width:60px}
.appt-day{font-family:'Playfair Display',serif;font-size:1.4rem;line-height:1;color:var(--gold2)}
.appt-month{font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.appt-info{flex:1}
.appt-prop{font-weight:500;font-size:.9rem}
.appt-sub{font-size:.78rem;color:var(--text2);margin-top:2px}
.appt-status{padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:600;white-space:nowrap}
.status-confirmed{background:rgba(76,175,122,.15);color:var(--green);border:1px solid rgba(76,175,122,.3)}
.status-pending{background:rgba(224,122,53,.15);color:var(--orange);border:1px solid rgba(224,122,53,.3)}
.status-cancelled{background:rgba(224,85,85,.15);color:var(--red);border:1px solid rgba(224,85,85,.3)}
.appt-actions{display:flex;gap:8px}
.appt-btn{padding:5px 10px;border-radius:6px;font-size:.75rem;font-weight:500;transition:all .2s}
.appt-btn-confirm{background:rgba(76,175,122,.15);color:var(--green);border:1px solid rgba(76,175,122,.3)}
.appt-btn-confirm:hover{background:rgba(76,175,122,.25)}
.appt-btn-cancel{background:rgba(224,85,85,.1);color:var(--red);border:1px solid rgba(224,85,85,.2)}
.appt-btn-cancel:hover{background:rgba(224,85,85,.2)}

/* ── ADMIN ── */
.admin-grid{display:grid;grid-template-columns:240px 1fr;gap:0;min-height:calc(100vh - 60px)}
.admin-sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:1.5rem 1rem}
.admin-sidebar h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:.75rem;padding:0 .5rem}
.admin-nav-item{display:flex;align-items:center;gap:10px;padding:.6rem .75rem;border-radius:var(--r);font-size:.85rem;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;margin-bottom:2px}
.admin-nav-item:hover{background:var(--bg3);color:var(--text)}
.admin-nav-item.active{background:rgba(201,168,76,.12);color:var(--gold2);border:1px solid rgba(201,168,76,.2)}
.admin-nav-item i{font-size:1rem;opacity:.8}
.admin-content{padding:1.5rem}
.admin-section{display:none}
.admin-section.active{display:block}
.admin-section-title{font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:1.25rem;color:var(--text)}

/* metrics */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1.5rem}
.metric-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem}
.metric-icon{width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:1rem;margin-bottom:.75rem}
.metric-val{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--text)}
.metric-label{font-size:.75rem;color:var(--text3);margin-top:2px}
.metric-trend{font-size:.72rem;margin-top:.5rem;display:flex;align-items:center;gap:4px}
.trend-up{color:var(--green)}
.trend-down{color:var(--red)}

/* admin table */
.admin-table{width:100%;border-collapse:collapse;font-size:.83rem}
.admin-table thead th{text-align:left;padding:.75rem 1rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);border-bottom:1px solid var(--border);font-weight:500}
.admin-table tbody td{padding:.85rem 1rem;border-bottom:1px solid var(--border);color:var(--text2)}
.admin-table tbody tr:hover td{background:var(--bg3)}
.admin-table tbody tr:last-child td{border-bottom:none}
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.admin-actions{display:flex;gap:8px;margin-bottom:1rem}
.admin-btn{padding:8px 16px;border-radius:var(--r);font-size:.82rem;font-weight:500;transition:all .2s}
.admin-btn-add{background:var(--gold);color:#0D0D0F}
.admin-btn-add:hover{background:var(--gold2)}
.admin-btn-edit{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.admin-btn-edit:hover{border-color:var(--gold2);color:var(--gold2)}

/* add property form */
.add-prop-form{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem}
.add-prop-form h3{font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1.25rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-full{grid-column:1/-1}
select.form-input{appearance:none;-webkit-appearance:none}

/* AI chat panel */
.ai-panel{position:fixed;bottom:1.5rem;right:1.5rem;z-index:150}
.ai-toggle{width:52px;height:52px;border-radius:50%;background:var(--gold);color:#0D0D0F;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.3rem;transition:all .3s;box-shadow:0 4px 20px rgba(201,168,76,.4)}
.ai-toggle:hover{background:var(--gold2);transform:scale(1.05)}
.ai-chat{display:none;flex-direction:column;width:340px;height:460px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);overflow:hidden;margin-bottom:12px}
.ai-chat.open{display:flex}
.ai-chat-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.ai-chat-avatar{width:36px;height:36px;border-radius:50%;background:rgba(201,168,76,.2);display:flex;align-items:center;justify-content:center;color:var(--gold2)}
.ai-chat-title{flex:1}
.ai-chat-title p{font-weight:500;font-size:.88rem}
.ai-chat-title span{font-size:.72rem;color:var(--green);display:flex;align-items:center;gap:4px}
.ai-chat-title span::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
.ai-close{background:none;border:none;color:var(--text2);font-size:1.1rem;cursor:pointer;padding:4px}
.ai-messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.75rem;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.msg{max-width:85%;font-size:.82rem;line-height:1.5}
.msg-bot{align-self:flex-start;background:var(--bg3);border:1px solid var(--border);border-radius:4px 12px 12px 12px;padding:.6rem .85rem;color:var(--text)}
.msg-user{align-self:flex-end;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.25);border-radius:12px 4px 12px 12px;padding:.6rem .85rem;color:var(--text)}
.msg-typing{align-self:flex-start;background:var(--bg3);border:1px solid var(--border);border-radius:4px 12px 12px 12px;padding:.6rem .85rem;display:flex;gap:4px;align-items:center}
.msg-typing span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:blink 1.2s infinite}
.msg-typing span:nth-child(2){animation-delay:.2s}
.msg-typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.ai-input-row{padding:.75rem 1rem;border-top:1px solid var(--border);display:flex;gap:8px}
.ai-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;color:var(--text);font-size:.82rem;outline:none}
.ai-input:focus{border-color:var(--gold)}
.ai-send{background:var(--gold);color:#0D0D0F;border:none;width:34px;height:34px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;flex-shrink:0;transition:all .2s}
.ai-send:hover{background:var(--gold2)}

/* notification toast */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg3);border:1px solid var(--green);border-radius:var(--r);padding:.75rem 1.25rem;font-size:.85rem;color:var(--green);display:flex;align-items:center;gap:8px;z-index:300;transition:transform .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* empty state */
.empty-state{text-align:center;padding:3rem;color:var(--text3)}
.empty-state i{font-size:2.5rem;display:block;margin-bottom:1rem}
.empty-state p{font-size:.88rem}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">EstateIQ <span>Premium Real Estate</span></div>
  <div class="nav-tabs">
