<script>
const EMOJIS = {apartment:'🏢',villa:'🏡',office:'🏬',plot:'🌳'};
const AGENTS = [
  {name:'Priya Sharma',initials:'PS',role:'Senior Agent',rating:'4.9',phone:'+91 98234 56789',listings:18},
  {name:'Rohit Mehta',initials:'RM',role:'Luxury Specialist',rating:'4.8',phone:'+91 97654 32109',listings:14},
  {name:'Sneha Kulkarni',initials:'SK',role:'Commercial Expert',rating:'4.7',phone:'+91 95432 10987',listings:22},
];

let properties = [
  {id:1,title:'Luxury 3BHK Sea View Apartment',price:8500000,location:'Bandra West, Mumbai',type:'apartment',listing:'sale',beds:3,baths:2,area:'1,850',parking:2,features:['Sea View','Swimming Pool','Gym','24/7 Security','Power Backup'],desc:'Stunning sea-facing apartment in the heart of Bandra. Fully furnished with premium interiors, modular kitchen, and breathtaking Arabian Sea views. Gated complex with world-class amenities.',agent:0,isNew:true,fav:false,views:234},
  {id:2,title:'Spacious 2BHK Koregaon Park',price:55000,location:'Koregaon Park, Pune',type:'apartment',listing:'rent',beds:2,baths:2,area:'1,200',parking:1,features:['Gym','Clubhouse','Garden','CCTV'],desc:'Well-maintained 2BHK in premium Koregaon Park society. Semi-furnished with high-speed internet, 24/7 water supply, and serene garden views.',agent:1,isNew:false,fav:false,views:178},
  {id:3,title:'Heritage Villa with Private Pool',price:32000000,location:'Jubilee Hills, Hyderabad',type:'villa',listing:'sale',beds:5,baths:5,area:'5,500',parking:4,features:['Private Pool','Home Theatre','Smart Home','Vastu Compliant','Modular Kitchen'],desc:'An architectural masterpiece spanning 5,500 sq ft with heritage architecture and modern luxury. Private pool, landscaped garden, and premium Italian marble flooring throughout.',agent:2,isNew:false,fav:false,views:456},
  {id:4,title:'Premium Office Space CBD',price:120000,location:'Nariman Point, Mumbai',type:'office',listing:'rent',beds:0,baths:3,area:'3,200',parking:8,features:['High Speed Internet','Conference Rooms','Cafeteria','Power Backup','Air Conditioning'],desc:'Grade A office space in Mumbai\'s premium commercial hub. Open floor plan with stunning city views, fully furnished ready-to-move-in workspace.',agent:0,isNew:true,fav:false,views:312},
  {id:5,title:'Elegant 4BHK Row House',price:12500000,location:'Aundh, Pune',type:'villa',listing:'sale',beds:4,baths:3,area:'2,800',parking:2,features:['Garden','Terrace','Modular Kitchen','Vastu','Security'],desc:'Beautiful row house in a premium gated community. Spacious rooms with ample natural light, private garden, and terrace. Perfect for a growing family.',agent:1,isNew:false,fav:false,views:189},
  {id:6,title:'Affordable Studio in IT Hub',price:25000,location:'Whitefield, Bengaluru',type:'apartment',listing:'rent',beds:1,baths:1,area:'620',parking:1,features:['Gym','Metro Nearby','Furnished','CCTV'],desc:'Compact, well-designed studio apartment ideal for IT professionals. 10 minutes from top tech parks. Fully furnished with AC, washing machine, and fast Wi-Fi.',agent:2,isNew:true,fav:false,views:521},
];
let appointments = [];
let favs = new Set();
let currentFilter = 'all';
let currentPropId = null;
let selectedTime = '';

function formatPrice(p, listing) {
  if(listing==='rent') return '₹'+p.toLocaleString('en-IN')+'/mo';
  if(p>=10000000) return '₹'+(p/10000000).toFixed(1)+'Cr';
  if(p>=100000) return '₹'+(p/100000).toFixed(0)+'L';
  return '₹'+p.toLocaleString('en-IN');
}

function renderProps(list) {
  const grid = document.getElementById('prop-grid');
  if(!list.length){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><i class="ti ti-building-off"></i><p>No properties match your search.</p></div>';return;}
  grid.innerHTML = list.map(p=>`
    <div class="prop-card" id="pc-${p.id}">
      <div class="prop-img" style="background:${p.type==='apartment'?'#1a1f2e':p.type==='villa'?'#1a2a1e':p.type==='office'?'#1e1a2e':'#1a251e'}">
        <div class="prop-img-inner">${EMOJIS[p.type]}</div>
        <div class="prop-badge ${p.isNew?'badge-new':p.listing==='sale'?'badge-sale':'badge-rent'}">${p.isNew?'New':p.listing==='sale'?'For Sale':'For Rent'}</div>
        <button class="prop-fav ${favs.has(p.id)?'active':''}" onclick="toggleFav(${p.id},event)"><i class="ti ti-heart${favs.has(p.id)?'-filled':''}" style="font-size:.9rem"></i></button>
      </div>
      <div class="prop-body">
        <div class="prop-price">${formatPrice(p.price,p.listing)}</div>
        <div class="prop-title">${p.title}</div>
        <div class="prop-loc"><i class="ti ti-map-pin" style="font-size:.85rem;color:var(--gold2)"></i>${p.location}</div>
        <div class="prop-meta">
          ${p.beds?`<span class="prop-meta-item"><i class="ti ti-bed"></i>${p.beds} Beds</span>`:''}
          <span class="prop-meta-item"><i class="ti ti-bath"></i>${p.baths} Bath</span>
          <span class="prop-meta-item"><i class="ti ti-ruler"></i>${p.area} ft²</span>
          <span class="prop-meta-item" style="margin-left:auto;color:var(--text3)"><i class="ti ti-eye"></i> ${p.views}</span>
        </div>
      </div>
      <div class="prop-actions">
        <button class="btn-book" onclick="openBookModal(${p.id})"><i class="ti ti-calendar-plus" style="margin-right:4px"></i>Book Tour</button>
        <button class="btn-view" onclick="openPropModal(${p.id})"><i class="ti ti-eye" style="margin-right:4px"></i>Details</button>
      </div>
    </div>
  `).join('');
  updateMetrics();
}

function setFilter(el, filter) {
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  currentFilter = filter;
  applySearch();
}
function clearFilters(){currentFilter='all';document.querySelector('.filter-chip').click();document.getElementById('search-loc').value='';document.getElementById('search-type').value='';document.getElementById('search-budget').value='';}
function applySearch(){
  let list = properties;
  const loc = document.getElementById('search-loc').value.toLowerCase();
  const type = document.getElementById('search-type').value.toLowerCase();
  const budget = parseInt(document.getElementById('search-budget').value)||0;
  if(loc) list = list.filter(p=>p.location.toLowerCase().includes(loc)||p.title.toLowerCase().includes(loc));
  if(type) list = list.filter(p=>p.type===type);
  if(budget) list = list.filter(p=>p.price<=budget);
  if(currentFilter==='sale') list=list.filter(p=>p.listing==='sale');
  else if(currentFilter==='rent') list=list.filter(p=>p.listing==='rent');
  else if(currentFilter==='new') list=list.filter(p=>p.isNew);
  else if(currentFilter!=='all') list=list.filter(p=>p.type===currentFilter);
  renderProps(list);
}

function toggleFav(id, e) {
  e.stopPropagation();
  if(favs.has(id)) favs.delete(id); else favs.add(id);
  applySearch(); updateMetrics();
}
function toggleFavFromModal(){
  if(!currentPropId) return;
  if(favs.has(currentPropId)) favs.delete(currentPropId); else favs.add(currentPropId);
  const btn = document.getElementById('modal-fav-btn');
  btn.innerHTML = favs.has(currentPropId)?'<i class="ti ti-heart-filled" style="margin-right:6px;color:var(--red)"></i>Saved':'<i class="ti ti-heart" style="margin-right:6px"></i>Save';
  updateMetrics();
}

function openPropModal(id) {
  const p = properties.find(x=>x.id===id);
  if(!p) return;
  currentPropId = id;
  p.views++;
  document.getElementById('modal-img').innerHTML = `<div style="font-size:6rem">${EMOJIS[p.type]}</div><button class="modal-close" onclick="closePropModal()"><i class="ti ti-x"></i></button>`;
  document.getElementById('modal-img').style.background = p.type==='apartment'?'#1a1f2e':p.type==='villa'?'#1a2a1e':p.type==='office'?'#1e1a2e':'#1a251e';
  document.getElementById('modal-badge-row').innerHTML = `<span class="prop-badge ${p.isNew?'badge-new':p.listing==='sale'?'badge-sale':'badge-rent'}" style="position:static;display:inline-block;margin-bottom:.5rem">${p.isNew?'New Launch':p.listing==='sale'?'For Sale':'For Rent'}</span>`;
  document.getElementById('modal-price').textContent = formatPrice(p.price,p.listing);
  document.getElementById('modal-title').textContent = p.title;
  document.getElementById('modal-loc').innerHTML = `<i class="ti ti-map-pin" style="color:var(--gold2)"></i>${p.location}`;
  document.getElementById('modal-specs').innerHTML = [
    p.beds?`<div class="spec-box"><div class="spec-val">${p.beds}</div><div class="spec-key">Bedrooms</div></div>`:'',
    `<div class="spec-box"><div class="spec-val">${p.baths}</div><div class="spec-key">Bathrooms</div></div>`,
    `<div class="spec-box"><div class="spec-val">${p.area}</div><div class="spec-key">Area (ft²)</div></div>`,
    `<div class="spec-box"><div class="spec-val">${p.parking}</div><div class="spec-key">Parking</div></div>`
  ].filter(Boolean).join('');
  document.getElementById('modal-desc').textContent = p.desc;
  document.getElementById('modal-features').innerHTML = p.features.map(f=>`<span class="feature-tag"><i class="ti ti-check" style="margin-right:4px;color:var(--green)"></i>${f}</span>`).join('');
  const ag = AGENTS[p.agent];
  document.getElementById('modal-agent').innerHTML = `<div class="agent-avatar">${ag.initials}</div><div class="agent-info"><div class="agent-name">${ag.name}</div><div class="agent-role">${ag.role}</div><div class="agent-rating">${'★'.repeat(5)} ${ag.rating} · ${ag.phone}</div></div>`;
  const favBtn = document.getElementById('modal-fav-btn');
  favBtn.innerHTML = favs.has(id)?'<i class="ti ti-heart-filled" style="margin-right:6px;color:var(--red)"></i>Saved':'<i class="ti ti-heart" style="margin-right:6px"></i>Save';
  document.getElementById('modal-book-btn').onclick = ()=>{closePropModal();openBookModal(id);};
  document.getElementById('prop-modal').classList.add('open');
}
function closePropModal(){document.getElementById('prop-modal').classList.remove('open');currentPropId=null;}
function closeModal(e){if(e.target.id==='prop-modal') closePropModal();}

function openBookModal(id) {
  const p = properties.find(x=>x.id===id);
  currentPropId = id;
  document.getElementById('book-prop-name').textContent = p.title;
  const today = new Date();
  const yyyy = today.getFullYear(), mm=String(today.getMonth()+1).padStart(2,'0'), dd=String(today.getDate()+1).padStart(2,'0');
  document.getElementById('book-date').value = `${yyyy}-${mm}-${dd}`;
  document.getElementById('book-date').min = `${yyyy}-${mm}-${dd}`;
  selectedTime = '';
  document.querySelectorAll('.time-slot').forEach(s=>s.classList.remove('selected'));
  document.getElementById('book-modal').classList.add('open');
}
function selectTime(el, t) {
  if(el.classList.contains('taken')) return;
  document.querySelectorAll('.time-slot').forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected');
  selectedTime = t;
}
function closeBookModal(e){if(e.target.id==='book-modal') document.getElementById('book-modal').classList.remove('open');}

function confirmBooking() {
  const name = document.getElementById('book-name').value.trim();
  const phone = document.getElementById('book-phone').value.trim();
  const email = document.getElementById('book-email').value.trim();
  const date = document.getElementById('book-date').value;
  if(!name||!date||!selectedTime){showToast('Please fill in required fields and select a time','error');return;}
  const p = properties.find(x=>x.id===currentPropId);
  const d = new Date(date);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const appt = {id:Date.now(),propId:currentPropId,propTitle:p.title,propLoc:p.location,client:name,phone,email,date,day:d.getDate(),month:months[d.getMonth()],time:selectedTime,status:'pending',msg:document.getElementById('book-msg').value};
  appointments.unshift(appt);
  document.getElementById('book-modal').classList.remove('open');
  renderAppointments();
  updateMetrics();
  showToast('Appointment booked! We\'ll confirm within 30 minutes.');
}

function renderAppointments() {
  const list = document.getElementById('appt-list');
  const badge = document.getElementById('appt-badge');
  badge.textContent = appointments.length;
  if(!appointments.length){list.innerHTML='<div class="empty-state"><i class="ti ti-calendar-off"></i><p>No appointments yet. Browse listings and book a viewing!</p></div>';return;}
  list.innerHTML = appointments.map(a=>`
    <div class="appt-card">
      <div class="appt-date"><div class="appt-day">${a.day}</div><div class="appt-month">${a.month}</div></div>
      <div class="appt-info">
        <div class="appt-prop">${a.propTitle}</div>
        <div class="appt-sub"><i class="ti ti-map-pin" style="margin-right:3px"></i>${a.propLoc} · <i class="ti ti-clock" style="margin-right:3px"></i>${a.time}</div>
      </div>
      <span class="appt-status status-${a.status}">${a.status.charAt(0).toUpperCase()+a.status.slice(1)}</span>
      <div class="appt-actions">
        ${a.status==='pending'?`<button class="appt-btn appt-btn-confirm" onclick="updateApptStatus(${a.id},'confirmed')"><i class="ti ti-check"></i></button>`:''}
        ${a.status!=='cancelled'?`<button class="appt-btn appt-btn-cancel" onclick="updateApptStatus(${a.id},'cancelled')"><i class="ti ti-x"></i></button>`:''}
      </div>
    </div>
  `).join('');
  renderAdminAppts();
}
function updateApptStatus(id, status) {
  const a = appointments.find(x=>x.id===id);
  if(a){a.status=status;renderAppointments();updateMetrics();showToast(`Appointment ${status}!`);}
}

function updateMetrics() {
  document.getElementById('metric-props').textContent = properties.length;
  document.getElementById('metric-appts').textContent = appointments.length;
  document.getElementById('metric-favs').textContent = favs.size;
  document.getElementById('metric-pending').textContent = appointments.filter(a=>a.status==='pending').length;
  renderOverviewTable();
  renderPropsTable();
  renderAdminAppts();
  renderAgentsTable();
}

function renderOverviewTable() {
  document.getElementById('overview-table-body').innerHTML = properties.map(p=>`
    <tr><td style="color:var(--text)">${p.title}</td><td style="text-transform:capitalize">${p.type}</td><td style="color:var(--gold2)">${formatPrice(p.price,p.listing)}</td>
    <td><span class="appt-status ${p.listing==='sale'?'status-confirmed':'status-pending'}" style="font-size:.7rem">${p.listing==='sale'?'For Sale':'For Rent'}</span></td>
    <td>${p.views}</td></tr>`).join('');
}
function renderPropsTable() {
  document.getElementById('props-table-body').innerHTML = properties.map(p=>`
    <tr><td style="color:var(--text)">${p.title}</td><td>${p.location}</td><td style="color:var(--gold2)">${formatPrice(p.price,p.listing)}</td>
    <td style="text-transform:capitalize">${p.type}</td>
    <td><span class="appt-status ${p.isNew?'status-pending':'status-confirmed'}" style="font-size:.7rem">${p.isNew?'New':'Active'}</span></td>
    <td><button class="appt-btn appt-btn-cancel" onclick="deleteProperty(${p.id})" title="Delete"><i class="ti ti-trash"></i></button></td></tr>`).join('');
}
function renderAdminAppts() {
  const body = document.getElementById('admin-appts-body');
  if(!body) return;
  body.innerHTML = appointments.length ? appointments.map(a=>`
    <tr><td style="color:var(--text)">${a.client||'—'}</td><td>${a.propTitle}</td><td>${a.day} ${a.month} · ${a.time}</td>
    <td><span class="appt-status status-${a.status}" style="font-size:.7rem">${a.status}</span></td>
    <td style="display:flex;gap:6px;padding:12px 0">
      ${a.status==='pending'?`<button class="appt-btn appt-btn-confirm" onclick="updateApptStatus(${a.id},'confirmed')">Confirm</button>`:''}
      ${a.status!=='cancelled'?`<button class="appt-btn appt-btn-cancel" onclick="updateApptStatus(${a.id},'cancelled')">Cancel</button>`:''}
    </td></tr>`).join('') : '<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text3)">No appointments yet</td></tr>';
}
function renderAgentsTable() {
  document.getElementById('agents-table-body').innerHTML = AGENTS.map((ag,i)=>`
    <tr><td><div style="display:flex;align-items:center;gap:10px"><div class="agent-avatar" style="width:32px;height:32px;font-size:.78rem">${ag.initials}</div><span style="color:var(--text)">${ag.name}</span></div></td>
    <td>${ag.role}</td><td style="color:var(--gold2)">${'★'.repeat(5)} ${ag.rating}</td><td>${ag.listings}</td><td style="color:var(--text2)">${ag.phone}</td></tr>`).join('');
}

function addProperty() {
  const title = document.getElementById('np-title').value.trim();
  const price = parseInt(document.getElementById('np-price').value);
  const location = document.getElementById('np-location').value.trim();
  if(!title||!price||!location){showToast('Please fill in required fields','error');return;}
  const newP = {
    id: Date.now(),
    title,price,location,
    type: document.getElementById('np-type').value.toLowerCase(),
    listing: document.getElementById('np-listing').value,
    beds: parseInt(document.getElementById('np-beds').value)||0,
    baths: parseInt(document.getElementById('np-baths').value)||1,
    area: document.getElementById('np-area').value||'—',
    parking: parseInt(document.getElementById('np-parking').value)||0,
    features: document.getElementById('np-features').value.split(',').map(f=>f.trim()).filter(Boolean),
    desc: document.getElementById('np-desc').value,
    agent: 0, isNew: true, fav: false, views: 0
  };
  properties.unshift(newP);
  clearForm();
  showToast('Property added successfully!');
  updateMetrics();
  applySearch();
}
function clearForm(){['np-title','np-price','np-location','np-beds','np-baths','np-area','np-parking','np-desc','np-features'].forEach(id=>document.getElementById(id).value='');}
function deleteProperty(id){properties=properties.filter(p=>p.id!==id);updateMetrics();applySearch();showToast('Property removed.');}

function showPage(p) {
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  const tabs=['listings','appointments','admin'];
  document.querySelectorAll('.nav-tab')[tabs.indexOf(p)].classList.add('active');
  if(p==='appointments') renderAppointments();
  if(p==='admin') updateMetrics();
}
function showAdminSection(id, el) {
  document.querySelectorAll('.admin-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.admin-nav-item').forEach(s=>s.classList.remove('active'));
  document.getElementById('admin-'+id).classList.add('active');
  if(el) el.classList.add('active');
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  const icon = type==='error'?'ti-alert-circle':'ti-check-circle';
  t.style.borderColor = type==='error'?'var(--red)':'var(--green)';
  t.style.color = type==='error'?'var(--red)':'var(--green)';
  t.innerHTML = `<i class="ti ${icon}"></i> <span>${msg}</span>`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3200);
}

function exportAppts(){if(!appointments.length){showToast('No appointments to export','error');return;}showToast('Appointments exported!');}

// AI Chat using Anthropic API
async function sendAI() {
  const input = document.getElementById('ai-input');
  const msg = input.value.trim();
  if(!msg) return;
  input.value = '';
  const msgs = document.getElementById('ai-messages');
  msgs.innerHTML += `<div class="msg msg-user">${msg}</div>`;
  msgs.innerHTML += `<div class="msg msg-typing" id="typing"><span></span><span></span><span></span></div>`;
  msgs.scrollTop = msgs.scrollHeight;
  const propContext = properties.map(p=>`${p.title} in ${p.location} - ${formatPrice(p.price,p.listing)} (${p.type}, ${p.listing})`).join('\n');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:`You are EstateIQ, a helpful real estate assistant for an Indian real estate platform. Be concise, friendly and helpful. Available properties:\n${propContext}\nHelp users find properties, understand pricing, book viewings, or answer real estate questions. Keep responses under 3 sentences unless detailed explanation is needed.`,
        messages:[{role:'user',content:msg}]
      })
    });
    const data = await res.json();
    document.getElementById('typing')?.remove();
    const reply = data.content?.[0]?.text || 'Sorry, I could not process that. Please try again.';
    msgs.innerHTML += `<div class="msg msg-bot">${reply}</div>`;
    msgs.scrollTop = msgs.scrollHeight;
  } catch(e) {
    document.getElementById('typing')?.remove();
    msgs.innerHTML += `<div class="msg msg-bot">Sorry, I'm having trouble connecting right now. Please try again!</div>`;
    msgs.scrollTop = msgs.scrollHeight;
  }
}

// Init
renderProps(properties);
updateMetrics();
document.getElementById('book-date').min = new Date(Date.now()+86400000).toISOString().split('T')[0];
</script>
</body>
</html>
